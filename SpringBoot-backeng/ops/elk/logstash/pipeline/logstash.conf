input {
  tcp {
    port => 5044
    codec => json_lines
  }
}

filter {
  if ![app] {
    mutate {
      add_field => { "app" => "springboot-backend" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "springboot-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
