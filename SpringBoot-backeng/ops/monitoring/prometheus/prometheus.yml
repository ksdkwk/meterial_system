global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'springboot-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # Windows + Docker Desktop 场景：容器访问宿主机
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'springboot-backend'
