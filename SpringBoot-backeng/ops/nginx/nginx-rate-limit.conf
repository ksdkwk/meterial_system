# 网关层限流（Nginx）示例
# 目标：每个IP每秒50个请求（允许突发100）
# 使用方式：将以下配置合并到你的 nginx.conf 对应 http/server/location 中

http {
    # 每个客户端IP限流：50 r/s
    # zone 大小按并发规模调整，10m大约可容纳十几万级状态
    limit_req_zone $binary_remote_addr zone=per_ip_50rps:10m rate=50r/s;

    upstream springboot_backend {
        server 127.0.0.1:8081;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        location / {
            # 网关层限流
            limit_req zone=per_ip_50rps burst=100 nodelay;
            limit_req_status 429;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://springboot_backend;
        }
    }
}
