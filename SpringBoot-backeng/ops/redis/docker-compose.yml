version: '3.8'

services:
  redis:
    image: redis:7.4-alpine
    container_name: app-redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data

volumes:
  redis_data:
