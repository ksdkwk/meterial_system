# Redis 持久化配置（本项目建议）
# 方式1：RDB 快照（定时）
save 900 1
save 300 10
save 60 10000

# 方式2：AOF（每秒刷盘）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 重写与可靠性
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
rdbcompression yes
rdbchecksum yes

# 建议开启目录持久化
# （容器中由 /data 卷承载）
dir /data
